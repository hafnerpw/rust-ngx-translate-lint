[package]
name = "ngx_translate_lint_rs"
version = "0.1.4"
edition = "2021"
description = "High-performance Rust port of ngx-translate-lint - check translation files in Angular/ngx-translate projects"
authors = ["hafnerpw"]
license = "MIT"
repository = "https://github.com/hafnerpw/rust-ngx-translate-lint"
homepage = "https://github.com/hafnerpw/rust-ngx-translate-lint"
readme = "README.md"
keywords = ["angular", "i18n", "translation", "lint", "ngx-translate"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "ngx_translate_lint_core"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ngx-translate-lint-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
console = "0.15"
colored = "2.1"
encoding_rs = "0.8"
flate2 = "1.0"
globwalk = "0.9"
glob = "0.3"
indicatif = "0.17"
once_cell = "1.19"
rayon = "1.10"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
strsim = "0.11"
thiserror = "1.0"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros"], optional = true }
url = "2.5"
napi = { version = "2.15", default-features = false, features = ["napi8", "serde-json"], optional = true }
napi-derive = { version = "2.15", optional = true }
walkdir = "2.5"
fancy-regex = "0.13"
aho-corasick = "1.1"

[features]
default = []
node = ["napi", "napi-derive"]

[dev-dependencies]
insta = "1.38"
pretty_assertions = "1.4"
